# Manual-only (see below): these jobs mirror the same Docker Compose stacks used locally
# (test data only; no secrets are needed or used), for an occasional on-demand run.
#   backend   pytest (incl. ruff/mypy/bandit/authz-matrix/contract tests) in the dev API image
#   web       eslint, next typegen, tsc, vitest, production build
#   e2e       Playwright on the e2e stack: Chromium, Firefox, WebKit, Pixel 7, iPhone 14
#   security  scripts/security-scan.sh (pip-audit, npm audit, semgrep, gitleaks, trivy, ...)
#   ios       additionally gated behind the `ios` input: derived files + unit tests on a macOS runner
# Visual baselines are rendered on macOS (fonts differ on Linux), so @visual stays part of
# the local release gate (README "Tests"), not CI.
name: CI

# Local-only deployment: GitHub is used for backup, not hosting CI. Runs are manual
# (workflow_dispatch) so nothing fires automatically on push/PR and nothing is billed.
# The real gate is the local Docker Compose stacks (README "Commands"/"Tests").
on:
  workflow_dispatch:
    inputs:
      ios:
        description: Also run the iOS unit tests (macOS runner, ~10x the minutes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: eventfaces

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Docker-heavy job: GitHub's runner image ships ~25 GB of SDKs this project never uses;
      # without removing them the disk fills up (seen: trivy, SeaweedFS writes).
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: cp .env.example .env
      # The containers run as other users than the runner and write caches into the
      # bind-mounted checkout (ruff, mypy).
      - run: chmod -R a+rwX .
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the API image (layer cache, incl. the face model)
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          files: docker-compose.yml
          targets: api
          load: true
          # Tagged as compose names them, so `up --no-build` uses these images.
          # The cache scope includes the branch: the GHA cache backend is a flat,
          # content-unaware namespace per scope string, so concurrent runs on different
          # branches/PRs writing to a bare "api" scope race and can serve another branch's
          # built image under a cache hit that looks valid but isn't.
          set: |
            api.tags=eventfaces-api
            api.cache-from=type=gha,scope=api-${{ github.head_ref || github.ref_name }}
            api.cache-to=type=gha,scope=api-${{ github.head_ref || github.ref_name }},mode=max
      - run: docker compose up -d --no-build --wait --wait-timeout 300 api
      # A test running over 5 minutes dumps every thread's stack (and so names itself).
      - run: docker compose exec -T api pytest -q -p no:cacheprovider -o faulthandler_timeout=300
        timeout-minutes: 45
      - if: failure() || cancelled()
        run: df -h / && docker compose logs --tail 200 api db s3

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Docker-heavy job: GitHub's runner image ships ~25 GB of SDKs this project never uses;
      # without removing them the disk fills up (seen: trivy, SeaweedFS writes).
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: cp .env.example .env
      # The containers run as other users than the runner and write caches into the
      # bind-mounted checkout (ruff, mypy).
      - run: chmod -R a+rwX .
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the API and web images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          files: docker-compose.yml
          targets: api,web
          load: true
          # Scoped by branch (see the backend job's comment): a bare "web" scope let a
          # concurrently-running PR's build overwrite/serve this one's cache, so this job
          # could end up testing another branch's frontend bundle against its own backend.
          set: |
            api.tags=eventfaces-api
            web.tags=eventfaces-web
            api.cache-from=type=gha,scope=api-${{ github.head_ref || github.ref_name }}
            web.cache-from=type=gha,scope=web-${{ github.head_ref || github.ref_name }}
            web.cache-to=type=gha,scope=web-${{ github.head_ref || github.ref_name }},mode=max
      - name: Start the e2e stack
        timeout-minutes: 15
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.ci.yml up -d --no-build api web
          for _ in $(seq 1 120); do curl -sf -o /dev/null http://localhost:3000/ && exit 0; sleep 5; done
          echo "web did not start"; docker compose logs --tail 100 web; exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - working-directory: frontend
        run: npx playwright test --grep-invert @visual
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7
      - if: failure() || cancelled()
        run: df -h / && docker compose logs --tail 200 api web s3

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Docker-heavy job: GitHub's runner image ships ~25 GB of SDKs this project never uses;
      # without removing them the disk fills up (seen: trivy, SeaweedFS writes).
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the full history
      - run: cp .env.example .env
      # The containers run as other users than the runner and write caches into the
      # bind-mounted checkout (ruff, mypy).
      - run: chmod -R a+rwX .
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          files: docker-compose.yml
          targets: api
          load: true
          set: |
            api.tags=eventfaces-api
            api.cache-from=type=gha,scope=api-${{ github.head_ref || github.ref_name }}
      - run: docker compose up -d --no-build --wait --wait-timeout 300 api
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Advisory databases and rule registries are fetched over the network and occasionally
      # time out; one retry. A real finding fails both runs.
      - run: scripts/security-scan.sh || { echo "::warning::security scan failed once; retrying"; scripts/security-scan.sh; }

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: xcodebuild -version && brew install xcodegen
      # No Docker on macOS runners, so no e2e API: integration and UI tests stay in the local gate.
      - run: ios/scripts/test.sh --no-api
