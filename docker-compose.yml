name: eventfaces

x-backend: &backend
  build:
    context: ./backend
    args:
      DEV: "1"  # test & security tooling (not in production images)
  env_file: .env
  environment:
    # Overridable via --env-file .env.demo without editing .env (Compose var substitution
    # reaches `environment:`, unlike `env_file:`, which it doesn't re-interpolate).
    FRONTEND_URL: ${FRONTEND_URL}
  volumes:
    - ./backend:/app
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
    s3: { condition: service_healthy }

services:
  db:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    # Not published to the host: use `docker compose exec db psql -U eventfaces`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 3s
      retries: 20

  # Local S3-compatible storage. (MinIO images are no longer published, so we use
  # SeaweedFS; production points S3_* at R2/S3 instead.)
  s3:
    image: chrislusf/seaweedfs:latest@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    entrypoint: ["/entrypoint.sh"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./infra/seaweedfs/entrypoint.sh:/entrypoint.sh:ro
      - s3data:/data
    ports: ["127.0.0.1:8333:8333"]  # browsers PUT guest uploads here (presigned)
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025"]  # shows verification/reset emails: never expose beyond localhost

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && python -m app.cli init-storage && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 30

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q celery,index
    restart: unless-stopped

  beat:
    <<: *backend
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      STORAGE_PUBLIC_ORIGIN: http://localhost:8333
      # Lets Next's dev server accept requests through a Tailscale Funnel hostname
      # (set via --env-file .env.demo); unset = disabled, as in normal dev.
      ALLOWED_DEV_ORIGIN: ${ALLOWED_DEV_ORIGIN:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }

  # Exposes the dev `web` container to the internet for demos, via Tailscale Funnel.
  # Off by default: only starts with `docker compose --profile demo up -d tailscale`.
  # Needs TS_AUTHKEY in .env (git-ignored). Use --env-file .env.demo for FRONTEND_URL
  # so emailed links (verify/reset/invite) point at the public hostname.
  tailscale:
    image: tailscale/tailscale:latest
    profiles: ["demo"]
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: eventface
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./infra/tailscale/funnel-persist.sh:/funnel-persist.sh:ro
    entrypoint: ["/bin/sh", "/funnel-persist.sh"]
    depends_on:
      web:
        condition: service_started

volumes:
  pgdata:
  s3data:
  tailscale_state:
