# Playwright end-to-end environment: swaps the dev API for tests/e2e_server.py (real app,
# test database/Redis DB/bucket, fake Drive, captured mail, /__e2e control endpoints).
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d api web
#   cd frontend && npx playwright test
# Switch back with `docker compose up -d api`.
services:
  api:
    command: python -m tests.e2e_server
    environment:
      FRONTEND_URL: http://localhost:3000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:8333
  web:
    environment:
      # Test-only app ids so the Universal Links file is served (e2e/mobile-links.spec.ts).
      APPLE_TEAM_ID: TEST000000
      IOS_BUNDLE_ID: app.eventfaces.test
      # Error reports go to the e2e API's fake GlitchTip (e2e/monitoring.spec.ts).
      SENTRY_DSN: http://e2e@api:8000/__e2e/glitchtip/1
      APP_VERSION: e2e
