# gitleaks: default rules + allowlist for GENERATED, git-ignored artifacts only.
# Justification: these paths are build/tool caches (never committed; the git-history scan
# covers everything committed). Next.js writes per-build preview-mode keys into
# .next/*manifest.json; those files are server-side only (verified not publicly served,
# see SECURITY_QA_REPORT.md, DAST section).
[extend]
useDefault = true

[allowlist]
description = "generated, git-ignored artifacts"
paths = [
  '''(^|/)\.next/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.mypy_cache/''',
  '''(^|/)\.ruff_cache/''',
  '''(^|/)\.pytest_cache/''',
  '''(^|/)public/mediapipe/''',
  '''(^|/)\.playwright-mcp/''',
  '''(^|/)graphify-out/''',
  '''(^|/)loadtest/results/''',
  '''(^|/)test-results/''',
  '''(^|/)playwright-report/''',
  '''(^|/)ios/build/''',  # Xcode derived data + SwiftPM checkouts (third-party test fixtures)
]
# Exact non-secret values the generic-api-key rule matches by name (justified in
# SECURITY_QA_REPORT.md, "Scanner results"): a Swift type name in a declaration
# (`let key: P256.Signing.PrivateKey`), not key material.
regexes = [
  '''^P256\.Signing\.PrivateKey$''',
]
