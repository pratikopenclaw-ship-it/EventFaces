# Production stack: Caddy (TLS) → Next.js → FastAPI; Celery worker + beat; Postgres; Redis;
# GlitchTip (error reports and uptime/heartbeat monitors) on errors.$DOMAIN.
# Object storage (R2/S3) and SMTP are external services configured via .env.prod.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Hardening: pinned images, only Caddy publishes ports, non-root app containers with
# no-new-privileges + all capabilities dropped + read-only root filesystems, memory limits,
# Redis password, DML-only database role for the app (the owner is used for migrations only).
name: eventfaces-prod

x-hardened: &hardened
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

x-backend: &backend
  <<: *hardened
  build:
    context: ./backend
    args:
      APP_VERSION: ${APP_VERSION:-dev}  # set by scripts/deploy.sh to the release tag
  env_file: .env.prod
  read_only: true
  tmpfs: ["/tmp:size=512m"]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]  # bind 80/443
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    depends_on: [web, glitchtip]

  web:
    <<: *hardened
    build:
      context: ./frontend
      target: prod
      args:
        API_INTERNAL_URL: http://api:8000
        STORAGE_PUBLIC_ORIGIN: ${S3_PUBLIC_ENDPOINT_URL}
    read_only: true
    tmpfs: ["/tmp:size=64m", "/app/.next/cache:size=256m,uid=1000,gid=1000"]
    environment:
      # iOS Universal Links (/.well-known/apple-app-site-association); unset = no app links.
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      IOS_BUNDLE_ID: ${IOS_BUNDLE_ID:-}
      # Browser and server errors of the web app (its own GlitchTip project; never sent to browsers).
      SENTRY_DSN: ${WEB_SENTRY_DSN:-}
      APP_VERSION: ${APP_VERSION:-dev}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SITE_URL: https://${DOMAIN}  # absolute link-preview image URLs
    mem_limit: 512m
    depends_on:
      api: { condition: service_healthy }

  api:
    <<: *backend
    # Migrations use MIGRATION_DATABASE_URL (schema owner); the app uses DATABASE_URL
    # (eventfaces_app, DML only). Each worker lazily loads the face model (~0.5 GB RAM).
    command: sh -c "alembic upgrade head && python -m app.cli init-storage && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-server-header --timeout-keep-alive 5 --limit-concurrency 200"
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 30

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q celery,index --max-tasks-per-child=200
    mem_limit: 3g

  beat:
    <<: *backend
    # Exactly ONE beat instance: it schedules retention and cleanup jobs.
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    mem_limit: 256m

  # Self-hosted error tracking (Sentry protocol). All in one container: web, task worker and
  # scheduler, with its queue in Postgres (no Valkey: our Redis is `noeviction` and sized for
  # the app). Own role and database on the shared Postgres (scripts/glitchtip-db.sh).
  # Runs its migrations on start. Sign-up is off: create the admin with
  #   docker compose … exec glitchtip ./manage.py createsuperuser
  glitchtip:
    <<: *hardened
    image: glitchtip/glitchtip:6.2.6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
    read_only: true
    tmpfs: ["/tmp:size=128m"]
    environment:
      SERVER_ROLE: all_in_one
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?set GLITCHTIP_SECRET_KEY in .env.prod}
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:?set GLITCHTIP_DB_PASSWORD in .env.prod}@db:5432/glitchtip
      VALKEY_URL: ""
      GLITCHTIP_DOMAIN: https://errors.${DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://errors.${DOMAIN}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-}
      ENABLE_USER_REGISTRATION: "false"
      ENABLE_ORGANIZATION_CREATION: "false"
      GLITCHTIP_RETENTION_DAYS: "30"  # reports carry opaque user ids; keep them no longer than backups
      GLITCHTIP_ENABLE_UPTIME: "true"
      GRANIAN_WORKERS: "1"
    volumes:
      - glitchtip_uploads:/code/uploads
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python3", "/code/healthcheck.py"]
      interval: 30s
      start_period: 120s
      retries: 5
    depends_on:
      db: { condition: service_healthy }

  db:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 2 API processes x (DB_POOL_SIZE + DB_MAX_OVERFLOW = 30) + Celery worker/beat pools
    # can exceed Postgres' default of 100 connections under a burst (SEC-042).
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    env_file: .env.prod
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction"]
    volumes:
      - redisdata:/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  glitchtip_uploads:
