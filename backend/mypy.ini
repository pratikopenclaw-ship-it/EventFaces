# Enforced by tests/test_static_analysis.py.
# Baseline for the whole app; strict flags for authentication/authorization code.
# (mypy's `strict` option is global-only, so the strict set is spelled out per module.)
[mypy]
python_version = 3.12
ignore_missing_imports = True
plugins = pydantic.mypy
check_untyped_defs = True
warn_unused_ignores = True

[mypy-app.core.security,app.core.rate_limit,app.api.deps,app.api.csrf,app.api.cookies,app.api.routes.auth,app.services.membership,app.services.photo_access,app.services.tokens,app.services.capture_tokens,app.services.downloads,app.services.invites]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_any_generics = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
